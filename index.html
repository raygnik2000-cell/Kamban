<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS AI - Kanban Board</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .dragging { opacity: 0.4; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col">

  <!-- Navbar -->
  <header class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold tracking-wide">Kanban LMS - Inteligencia Artificial</h1>
      <p class="text-xs text-slate-400">Gestión de desarrollo e implemetación web</p>
    </div>
    <button onclick="toggleModal(true)" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow">
      + Nueva Tarjeta
    </button>
  </header>

  <!-- Board Container -->
  <main class="flex-1 p-6 overflow-x-auto">
    <div class="flex gap-4 min-w-[1200px] h-full items-start" id="kanban-board">
      
      <!-- Columns rendering by JS -->
      <div class="kanban-col bg-slate-200/70 p-4 rounded-xl w-1/5 flex flex-col max-h-[80vh]" data-status="Backlog">
        <h2 class="font-bold text-slate-700 mb-3 flex items-center justify-between">
          <span>Backlog</span> <span class="count bg-slate-300 text-slate-600 text-xs px-2 py-0.5 rounded-full">0</span>
        </h2>
        <div class="card-list flex-1 overflow-y-auto space-y-3 min-h-[150px]"></div>
      </div>

      <div class="kanban-col bg-slate-200/70 p-4 rounded-xl w-1/5 flex flex-col max-h-[80vh]" data-status="Asignado a">
        <h2 class="font-bold text-slate-700 mb-3 flex items-center justify-between">
          <span>Asignado a</span> <span class="count bg-slate-300 text-slate-600 text-xs px-2 py-0.5 rounded-full">0</span>
        </h2>
        <div class="card-list flex-1 overflow-y-auto space-y-3 min-h-[150px]"></div>
      </div>

      <div class="kanban-col bg-slate-200/70 p-4 rounded-xl w-1/5 flex flex-col max-h-[80vh]" data-status="En progreso">
        <h2 class="font-bold text-blue-800 mb-3 flex items-center justify-between">
          <span>En progreso</span> <span class="count bg-blue-200 text-blue-800 text-xs px-2 py-0.5 rounded-full">0</span>
        </h2>
        <div class="card-list flex-1 overflow-y-auto space-y-3 min-h-[150px]"></div>
      </div>

      <div class="kanban-col bg-slate-200/70 p-4 rounded-xl w-1/5 flex flex-col max-h-[80vh]" data-status="En revisión">
        <h2 class="font-bold text-amber-800 mb-3 flex items-center justify-between">
          <span>En revisión</span> <span class="count bg-amber-200 text-amber-800 text-xs px-2 py-0.5 rounded-full">0</span>
        </h2>
        <div class="card-list flex-1 overflow-y-auto space-y-3 min-h-[150px]"></div>
      </div>

      <div class="kanban-col bg-slate-200/70 p-4 rounded-xl w-1/5 flex flex-col max-h-[80vh]" data-status="Finalizado">
        <h2 class="font-bold text-emerald-800 mb-3 flex items-center justify-between">
          <span>Finalizado</span> <span class="count bg-emerald-200 text-emerald-800 text-xs px-2 py-0.5 rounded-full">0</span>
        </h2>
        <div class="card-list flex-1 overflow-y-auto space-y-3 min-h-[150px]"></div>
      </div>

    </div>
  </main>

  <!-- Modal Creación -->
  <div id="modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 space-y-4">
      <h3 class="text-lg font-bold text-slate-800">Crear Nueva Tarjeta</h3>
      <form id="task-form" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase">Título</label>
          <input type="text" id="title" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase">Descripción</label>
          <textarea id="description" rows="2" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase">Responsable</label>
            <select id="assignee" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
              <option value="Carlos Pérez">Carlos Pérez</option>
              <option value="Ana Gómez">Ana Gómez</option>
              <option value="Luis Martínez">Luis Martínez</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase">Estado Inicial</label>
            <select id="status" class="w-full border rounded-lg p-2 text-sm outline-none">
              <option value="Backlog">Backlog</option>
              <option value="Asignado a">Asignado a</option>
              <option value="En progreso">En progreso</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase">Inicio</label>
            <input type="date" id="startDate" class="w-full border rounded-lg p-2 text-sm outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase">Fin</label>
            <input type="date" id="endDate" class="w-full border rounded-lg p-2 text-sm outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase">URL del Entregable</label>
          <input type="url" id="url" placeholder="https://github.com/..." class="w-full border rounded-lg p-2 text-sm outline-none">
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="toggleModal(false)" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
          <button type="submit" class="px-4 py-2 text-sm font-medium bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Guardar</button>
        </div>
      </form>
    </div>
  </div>
